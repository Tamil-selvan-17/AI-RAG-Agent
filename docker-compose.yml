# Docker Compose for the AI RAG Agent.
#
# Settings (AI provider, models, API keys, ADMIN_PASSWORD, ...) come from
# backend/.env. Only container-specific values (hostnames, paths) are set here.
#
# By default Qdrant, Redis and Ollama are expected on the host machine (or in
# the cloud via QDRANT_URL / REDIS_URL in backend/.env) and are reached via
# host.docker.internal.
#
#   App only:                   docker compose up --build
#   App + Qdrant + Redis too:   docker compose -f docker-compose.yml -f docker-compose.infra.yml up --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      QDRANT_HOST: host.docker.internal
      REDIS_HOST: host.docker.internal
      UPLOAD_DIR: /app/documents
      LOG_DIR: /app/logs
    volumes:
      - ./documents:/app/documents
      - ./backend/logs:/app/logs
      - ./frontend:/frontend:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    container_name: ai-rag-frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
