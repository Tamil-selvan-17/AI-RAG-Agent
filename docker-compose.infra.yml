# Adds local Qdrant and Redis containers and points the backend at them.
# Use together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.infra.yml up --build
#
# Leave QDRANT_URL / REDIS_URL empty in backend/.env, otherwise the cloud
# services configured there are used instead of these containers.

services:
  backend:
    environment:
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: ai-rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: ai-rag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  qdrant_storage:
